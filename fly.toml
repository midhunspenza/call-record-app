# Fly.io config for spenza-console.
# Single always-on machine: the custom server holds long-lived WebSocket
# connections (/api/stream, /api/ws/voice/incoming) and registers webhooks on
# boot, so we must NOT scale to zero or run multiple unsynced instances.

app = "spenza-console"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running so inbound voice WS + boot registration persist.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

# Report durability. Without this the QoS store is memory-only and every deploy
# discards the history — on a pilot taking a few calls a day, each report is
# evidence that cannot be recreated. QOS_STORE_PATH points inside this mount.
[mounts]
  source = "qos_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
